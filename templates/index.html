<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Data 查詢系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .columns-display {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .column-tag {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .column-tag:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .column-tag.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 14px;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            border: 1px solid #ef5350;
            border-radius: 5px;
            padding: 15px;
            color: #c62828;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #e8f5e9;
            border: 1px solid #66bb6a;
            border-radius: 5px;
            padding: 15px;
            color: #2e7d32;
            margin-bottom: 20px;
            display: none;
        }

        .success.show {
            display: block;
        }

        .info-text {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 12px;
            border-radius: 3px;
            color: #1565c0;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #f5f5f5;
            position: sticky;
            top: 0;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            word-wrap: break-word;
            max-width: 300px;
        }

        tr:hover {
            background: #f9f9f9;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #f5f5f5;
            border-radius: 5px;
            padding: 12px 20px;
            flex: 1;
            min-width: 150px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-top: 5px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 768px) {
            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            td {
                max-width: 200px;
                font-size: 12px;
            }

            th {
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Open Data 查詢系統</h1>
            <p>靈活查詢和展示各類開放資料</p>
        </div>

        <div class="card">
            <h2>資料來源設定</h2>
            <div class="form-group">
                <label for="url">資料 URL</label>
                <input type="url" id="url" placeholder="輸入資料 URL..." value="{{ default_url }}">
                <small style="color: #999; margin-top: 5px; display: block;">支持 CSV 和 JSON 格式</small>
            </div>

            <div class="form-group">
                <label for="columns">欄位選擇（以逗號分隔，留空表示顯示全部）</label>
                <input type="text" id="columns" placeholder="例如: author,title,startdate" 
                       title="輸入要顯示的欄位名稱，以逗號分隔">
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="loadColumns()">🔍 檢查可用欄位</button>
                <button class="btn-primary" onclick="fetchData()">📥 取得資料</button>
                <button class="btn-secondary" onclick="resetForm()">🔄 重置</button>
            </div>
        </div>

        <div id="availableColumnsCard" class="card" style="display: none;">
            <h2>可用欄位</h2>
            <div id="availableColumns" class="columns-display"></div>
            <p style="margin-top: 15px; color: #999; font-size: 13px;">💡 點擊下方欄位標籤快速選擇</p>
        </div>

        <div id="messageContainer"></div>

        <div id="resultCard" class="card" style="display: none;">
            <h2>查詢結果</h2>
            <div class="stats" id="stats"></div>
            <div id="tableContainer" class="table-wrapper"></div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('url');
        const columnsInput = document.getElementById('columns');
        const messageContainer = document.getElementById('messageContainer');
        const resultCard = document.getElementById('resultCard');
        const availableColumnsCard = document.getElementById('availableColumnsCard');
        let allAvailableColumns = [];

        function showMessage(message, type = 'error') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `${type} show`;
            msgDiv.textContent = message;
            msgDiv.style.marginBottom = '20px';
            messageContainer.innerHTML = '';
            messageContainer.appendChild(msgDiv);
            setTimeout(() => msgDiv.classList.remove('show'), 5000);
        }

        function showLoading() {
            resultCard.style.display = 'block';
            document.getElementById('tableContainer').innerHTML = '<div class="loading"><div class="spinner"></div>正在加載資料...</div>';
            document.getElementById('stats').innerHTML = '';
        }

        function loadColumns() {
            const url = urlInput.value || '{{ default_url }}';
            if (!url) {
                showMessage('請輸入有效的 URL', 'error');
                return;
            }

            showLoading();
            
            fetch('/api/columns', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    allAvailableColumns = data.columns;
                    displayAvailableColumns(data.columns, data.total_records);
                    showMessage(`✅ 找到 ${data.total_records} 筆記錄，共 ${data.columns.length} 個欄位`, 'success');
                } else {
                    showMessage(data.error, 'error');
                    resultCard.style.display = 'none';
                }
            })
            .catch(e => {
                showMessage(`錯誤: ${e.message}`, 'error');
                resultCard.style.display = 'none';
            });
        }

        function displayAvailableColumns(columns, totalRecords) {
            const container = document.getElementById('availableColumns');
            container.innerHTML = columns.map(col => 
                `<div class="column-tag" onclick="toggleColumn('${col}')">${col}</div>`
            ).join('');
            availableColumnsCard.style.display = 'block';
            updateColumnTags();
        }

        function toggleColumn(col) {
            const current = columnsInput.value.split(',').map(c => c.trim()).filter(c => c);
            const index = current.indexOf(col);
            if (index > -1) {
                current.splice(index, 1);
            } else {
                current.push(col);
            }
            columnsInput.value = current.join(', ');
            updateColumnTags();
        }

        function updateColumnTags() {
            const selected = columnsInput.value.split(',').map(c => c.trim()).filter(c => c);
            document.querySelectorAll('.column-tag').forEach(tag => {
                if (selected.includes(tag.textContent)) {
                    tag.classList.add('selected');
                } else {
                    tag.classList.remove('selected');
                }
            });
        }

        function fetchData() {
            const url = urlInput.value || '{{ default_url }}';
            const columnsStr = columnsInput.value.trim();
            const columns = columnsStr ? columnsStr.split(',').map(c => c.trim()) : [];

            if (!url) {
                showMessage('請輸入有效的 URL', 'error');
                return;
            }

            showLoading();

            fetch('/api/fetch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url, columns: columns })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    displayTable(data.rows, data.selected_columns, data.total_records, data.displayed_records);
                    showMessage(`✅ 成功加載 ${data.displayed_records}/${data.total_records} 筆記錄`, 'success');
                } else {
                    showMessage(data.error, 'error');
                    resultCard.style.display = 'none';
                }
            })
            .catch(e => {
                showMessage(`錯誤: ${e.message}`, 'error');
                resultCard.style.display = 'none';
            });
        }

        function displayTable(rows, columns, total, displayed) {
            resultCard.style.display = 'block';
            
            // Display stats
            const statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = `
                <div class="stat-box">
                    <div class="stat-label">總筆數</div>
                    <div class="stat-value">${total}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">顯示筆數</div>
                    <div class="stat-value">${displayed}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">欄位數</div>
                    <div class="stat-value">${columns.length}</div>
                </div>
            `;

            if (rows.length === 0) {
                document.getElementById('tableContainer').innerHTML = '<div class="no-data">📭 無資料</div>';
                return;
            }

            let tableHtml = '<table><thead><tr>';
            columns.forEach(col => {
                tableHtml += `<th>${col}</th>`;
            });
            tableHtml += '</tr></thead><tbody>';

            rows.forEach(row => {
                tableHtml += '<tr>';
                columns.forEach(col => {
                    const value = row[col] || '';
                    tableHtml += `<td>${escapeHtml(String(value))}</td>`;
                });
                tableHtml += '</tr>';
            });

            tableHtml += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = tableHtml;
        }

        function resetForm() {
            urlInput.value = '{{ default_url }}';
            columnsInput.value = '';
            messageContainer.innerHTML = '';
            resultCard.style.display = 'none';
            availableColumnsCard.style.display = 'none';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Allow Enter key to fetch data
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && (e.target === urlInput || e.target === columnsInput)) {
                fetchData();
            }
        });
    </script>
</body>
</html>
